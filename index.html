<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Times</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f1e2e; color:#eef; display:flex; justify-content:center; padding:20px; margin:0; }
  .card { background:#182c42; border-radius:14px; padding:24px; max-width:480px; width:100%; box-shadow:0 6px 24px rgba(0,0,0,.4); }
  h1 { font-size:1.4rem; margin:0 0 6px; }
  .sub { color:#9bb; font-size:.9rem; margin-bottom:16px; }
  button, input, select { font-size:1rem; padding:8px 12px; border-radius:8px; border:none; }
  button { background:#2e8b57; color:#fff; cursor:pointer; }
  button:hover { background:#36a466; }
  button.secondary { background:#2a4260; }
  button.secondary:hover { background:#355378; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:10px 6px; border-bottom:1px solid #2a4260; }
  td:last-child { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .note { font-size:.8rem; color:#f5c16c; }
  .next { background:#24486b; }
  #status { font-size:.9rem; color:#9bb; margin-bottom:10px; }
  .foot { font-size:.75rem; color:#89a; margin-top:14px; line-height:1.4; }
  #settings { display:none; background:#12233a; border-radius:10px; padding:16px; margin-bottom:16px; }
  #settings.open { display:block; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; }
  .row label { font-size:.9rem; }
  .row input[type=number] { width:90px; text-align:right; }
  .row select { max-width:230px; }
  .hint { font-size:.75rem; color:#89a; margin-top:-6px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Prayer Times</h1>
  <div class="sub" id="subtitle"></div>

  <div class="controls">
    <button id="locBtn">📍 Use my location</button>
    <input type="date" id="dateInput">
    <button class="secondary" id="settingsBtn">⚙️ Settings</button>
  </div>

  <div id="settings">
    <div class="row">
      <label for="preset">Preset</label>
      <select id="preset">
        <option value="custom">Custom</option>
        <option value="15,15">ISNA (15° / 15°)</option>
        <option value="18,17">Muslim World League (18° / 17°)</option>
        <option value="18,18">Karachi (18° / 18°)</option>
        <option value="19.5,17.5">Egyptian (19.5° / 17.5°)</option>
        <option value="12,12">12° / 12° (some UK mosques)</option>
      </select>
    </div>
    <div class="row">
      <label for="fajrAngle">Fajr angle (°)</label>
      <input type="number" id="fajrAngle" min="0" max="25" step="0.5">
    </div>
    <div class="row">
      <label for="ishaAngle">Isha angle (°)</label>
      <input type="number" id="ishaAngle" min="0" max="25" step="0.5">
    </div>
    <div class="row">
      <label for="highLat">High-latitude method</label>
      <select id="highLat">
        <option value="angle">Angle-based (angle/60 of night)</option>
        <option value="seventh">One-seventh of the night</option>
        <option value="midnight">Middle of the night</option>
        <option value="none">None (show — if not reached)</option>
      </select>
    </div>
    <div class="hint">This is used when the sun doesn't get far enough below the horizon, which happens in UK summers.</div>
    <button class="secondary" id="resetBtn">Reset to defaults</button>
  </div>

  <div id="status">Press the button to get your location.</div>
  <table id="times"></table>
  <div class="foot" id="foot"></div>
</div>

<script>
// ---------- Settings (persisted) ----------
const DEFAULTS = { fajr: 15, isha: 15, highLat: "angle" };
let settings = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("prayerSettings") || "{}"));
const SUN_ANGLE = 0.833;

function saveSettings() { localStorage.setItem("prayerSettings", JSON.stringify(settings)); }

// ---------- Math helpers (degrees) ----------
const dtr = d => d * Math.PI / 180;
const rtd = r => r * 180 / Math.PI;
const sin = d => Math.sin(dtr(d));
const cos = d => Math.cos(dtr(d));
const tan = d => Math.tan(dtr(d));
const asin = x => rtd(Math.asin(x));
const acos = x => rtd(Math.acos(x));
const atan2 = (y, x) => rtd(Math.atan2(y, x));
const acot = x => rtd(Math.atan(1 / x));
const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
const fixAngle = a => fix(a, 360);
const fixHour = h => fix(h, 24);

// ---------- Astronomy ----------
function julian(year, month, day) {
  if (month <= 2) { year -= 1; month += 12; }
  const A = Math.floor(year / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
}

function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D);
  const q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * sin(g) + 0.020 * sin(2 * g));
  const e = 23.439 - 0.00000036 * D;
  const RA = fixHour(atan2(cos(e) * sin(L), cos(L)) / 15);
  return { decl: asin(sin(e) * sin(L)), eqt: q / 15 - RA };
}

// ---------- Prayer time calculator ----------
function calcTimes(date, lat, lng) {
  const FAJR = settings.fajr, ISHA = settings.isha;
  const jDate = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lng / (15 * 24);
  const tz = -new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12).getTimezoneOffset() / 60;

  const midDay = t => fixHour(12 - sunPosition(jDate + t).eqt);
  const sunAngleTime = (angle, t, ccw) => {
    const decl = sunPosition(jDate + t).decl;
    const T = acos((-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat))) / 15;
    return midDay(t) + (ccw ? -T : T);
  };
  const asrTime = (factor, t) => {
    const decl = sunPosition(jDate + t).decl;
    return sunAngleTime(-acot(factor + tan(Math.abs(lat - decl))), t);
  };

  let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr1: 13, asr2: 13, sunset: 18, isha: 18 };
  for (let i = 0; i < 3; i++) {
    const p = {}; for (const k in t) p[k] = (isNaN(t[k]) ? ({fajr:5,isha:18})[k] : t[k]) / 24;
    t = {
      fajr:    sunAngleTime(FAJR, p.fajr, true),
      sunrise: sunAngleTime(SUN_ANGLE, p.sunrise, true),
      dhuhr:   midDay(p.dhuhr),
      asr1:    asrTime(1, p.asr1),
      asr2:    asrTime(2, p.asr2),
      sunset:  sunAngleTime(SUN_ANGLE, p.sunset),
      isha:    sunAngleTime(ISHA, p.isha)
    };
  }

  // High-latitude adjustment
  const adjusted = { fajr: false, isha: false };
  if (settings.highLat !== "none") {
    const night = 24 - (t.sunset - t.sunrise);
    const portion = angle =>
      settings.highLat === "seventh" ? night / 7 :
      settings.highLat === "midnight" ? night / 2 :
      (angle / 60) * night;

    const fp = portion(FAJR);
    if (isNaN(t.fajr) || (t.sunrise - t.fajr) > fp) { t.fajr = t.sunrise - fp; adjusted.fajr = true; }
    const ip = portion(ISHA);
    if (isNaN(t.isha) || (t.isha - t.sunset) > ip) { t.isha = t.sunset + ip; adjusted.isha = true; }
  }

  const adj = tz - lng / 15;
  const out = {};
  for (const k in t) out[k] = t[k] + adj;
  out.maghrib = out.sunset;
  return { times: out, adjusted, tz };
}

function fmt(h) {
  if (isNaN(h)) return "—";
  h = fixHour(h + 0.5 / 60);
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

// ---------- UI ----------
let coords = null;
const $ = id => document.getElementById(id);
$("dateInput").valueAsDate = new Date();

function syncSettingsUI() {
  $("fajrAngle").value = settings.fajr;
  $("ishaAngle").value = settings.isha;
  $("highLat").value = settings.highLat;
  const key = `${settings.fajr},${settings.isha}`;
  $("preset").value = [...$("preset").options].some(o => o.value === key) ? key : "custom";
  $("subtitle").textContent =
    `Fajr ${settings.fajr}° · Isha ${settings.isha}° · Asr: Standard & Hanafi`;
}

function render() {
  syncSettingsUI();
  if (!coords) return;
  const [y, m, d] = $("dateInput").value.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const { times, adjusted, tz } = calcTimes(date, coords.lat, coords.lng);

  const rows = [
    ["Fajr", times.fajr, adjusted.fajr],
    ["Sunrise", times.sunrise],
    ["Dhuhr", times.dhuhr],
    ["Asr (Standard – Shafi'i, Maliki, Hanbali)", times.asr1],
    ["Asr (Hanafi)", times.asr2],
    ["Maghrib", times.maghrib],
    ["Isha", times.isha, adjusted.isha]
  ];

  const now = new Date();
  const isToday = now.toDateString() === date.toDateString();
  const nowH = now.getHours() + now.getMinutes() / 60;
  const nextIdx = isToday ? rows.findIndex(r => r[0] !== "Sunrise" && !isNaN(r[1]) && fixHour(r[1]) > nowH) : -1;

  $("times").innerHTML = rows.map((r, i) =>
    `<tr class="${i === nextIdx ? "next" : ""}">
       <td>${r[0]}${r[2] ? ' <span class="note">*</span>' : ""}</td>
       <td>${fmt(r[1])}</td>
     </tr>`).join("");

  const methodName = { angle: "angle-based", seventh: "one-seventh of the night", midnight: "middle of the night" }[settings.highLat];
  $("foot").innerHTML =
    `Location: ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)} (±${Math.round(coords.acc)} m) · UTC${tz >= 0 ? "+" : ""}${tz}<br>` +
    ((adjusted.fajr || adjusted.isha) ? `<span class="note">* High-latitude adjustment applied (${methodName}).</span><br>` : "") +
    `Times are calculated astronomically. Check with your local mosque, as many add safety minutes.`;
}

// Settings events
$("settingsBtn").onclick = () => $("settings").classList.toggle("open");
$("preset").onchange = e => {
  if (e.target.value === "custom") return;
  const [f, i] = e.target.value.split(",").map(Number);
  settings.fajr = f; settings.isha = i; saveSettings(); render();
};
$("fajrAngle").oninput = e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) { settings.fajr = v; saveSettings(); render(); } };
$("ishaAngle").oninput = e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) { settings.isha = v; saveSettings(); render(); } };
$("highLat").onchange = e => { settings.highLat = e.target.value; saveSettings(); render(); };
$("resetBtn").onclick = () => { settings = Object.assign({}, DEFAULTS); saveSettings(); render(); };

// Location
$("locBtn").onclick = () => {
  if (!navigator.geolocation) { $("status").textContent = "Geolocation is not supported by this browser."; return; }
  $("status").textContent = "Getting precise location…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      coords = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      $("status").textContent = "Location found.";
      render();
    },
    err => { $("status").textContent = "Could not get location: " + err.message; },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
};
$("dateInput").onchange = render;
$("dateInput").oninput = render;

$("dateInput").onchange = render;
render();
</script>
</body>
</html>
